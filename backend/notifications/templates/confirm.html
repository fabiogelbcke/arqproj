<!doctype html>
<html lang="$lang"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:24px 12px;background:#f4f4f2;color:#242629;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e2de">
<tr><td style="padding:24px 28px 8px">$header</td></tr>
<tr><td style="padding:16px 28px 24px;font-size:16px;line-height:1.5">
<p style="margin:0 0 12px">$hello</p>
<p style="margin:0 0 16px">$intro</p>
<p style="margin:0 0 20px;font-size:32px;font-weight:600;letter-spacing:6px;font-family:Menlo,Consolas,monospace">$code</p>
<p style="margin:0 0 12px">$orLink</p>
<a href="$link" style="display:inline-block;background:#242629;color:#ffffff;text-decoration:none;padding:12px 20px;font-size:15px">$button</a>
<p style="margin:20px 0 0;font-size:13px;color:#66686b">$expiry</p>
</td></tr>
<tr><td style="padding:20px 28px 24px;font-size:12px;line-height:1.5;color:#66686b;border-top:1px solid #e2e2de">$ignore</td></tr>
</table></td></tr></table>
</body></html>
