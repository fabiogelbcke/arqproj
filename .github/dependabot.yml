# Security updates only: version updates are off (open-pull-requests-limit: 0),
# so Dependabot opens a pull request only when a library we use has a published
# advisory. Security updates themselves are switched on in the repository's
# settings (Code security → Dependabot security updates). They open against the
# default branch, `main`: retarget each one to `staging` before merging, like any
# other change (docs/pull-requests.md).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
