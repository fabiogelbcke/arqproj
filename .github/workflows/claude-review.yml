# A fresh Claude review of a pull request, when someone with write access
# comments "@claude review" on it (docs/pull-requests.md, "Code review"). Add
# "high-risk" to the comment ("@claude review high-risk") for the larger model.
# Runs on the Claude subscription: the CLAUDE_CODE_OAUTH_TOKEN secret comes from
# `claude setup-token`. Comment-triggered workflows run from the default branch's
# copy of this file, so a change to it takes effect once it reaches `main`.
name: Claude review

on:
  issue_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude review') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1.0.264
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Review this pull request. You did not write it, and the pull
            request's branch is checked out in the working directory. Read
            AGENTS.md (its "Review guidelines"), docs/pull-requests.md and the
            documentation the description's Context section links, then the
            pull request through `gh pr view` and `gh pr diff`; read any other
            file you need. Skip AGENTS.md's "Git workflow" steps: you change
            nothing. Look for bugs and for mismatches with the documentation,
            keeping to real problems for our setup, not style.

            Put each finding on its line with
            mcp__github_inline_comment__create_inline_comment (confirmed: true),
            marked P1 (serious), P2 (worth fixing) or P3 (minor). Then post one
            summary with `gh pr comment`, starting "🤖 Claude: fresh-agent
            review", listing the findings, or saying it is clean (👍).
          claude_args: |
            --model ${{ contains(github.event.comment.body, 'high-risk') && 'claude-opus-5-5' || 'claude-sonnet-5-5' }}
            --max-turns 60
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
