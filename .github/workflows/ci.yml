# Checks on every pull request into `staging` (and on pushes to it). The branch
# accepts only pull requests whose checks pass. Same commands as locally: `make
# test`, `make lint`, `make e2e`, plus building the production image.
name: CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The superuser of the PostgreSQL started below (locally, it is you).
  PGUSER: postgres

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # On the runner's own network, so the server really is local: the tests'
      # guard refuses any database server that is not on this machine, and a
      # service container would sit behind Docker's network instead.
      - name: PostgreSQL 17
        run: |
          docker run -d --name postgres --network host -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for i in $(seq 60); do docker exec postgres pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --frozen --no-group legacy
      - run: uv run python -m backend.commands.local_db setup
      - run: uv run pytest -q
      - run: uv run ruff check backend && uv run ruff format --check backend

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run api-types:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # On the runner's own network, so the server really is local: the tests'
      # guard refuses any database server that is not on this machine, and a
      # service container would sit behind Docker's network instead.
      - name: PostgreSQL 17
        run: |
          docker run -d --name postgres --network host -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for i in $(seq 60); do docker exec postgres pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --no-group legacy
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # The production image, built and started the way Cloud Run starts it (non-root
  # user, its CMD and libraries, the bundled staff app) against a migrated
  # database, before anything reaches staging (plan section 19).
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: PostgreSQL 17
        run: |
          docker run -d --name postgres --network host -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for i in $(seq 60); do docker exec postgres pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --frozen --no-group legacy
      - run: uv run python -m backend.commands.e2e
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          load: true
          tags: portal:ci
          build-args: BUILD_ID=ci
      - name: Start the image and check it answers
        run: |
          docker run -d --name app --network host -e PORT=8020 \
            -e DATABASE_URL=postgresql+psycopg://arqproj_app@127.0.0.1:5432/arqproj_e2e portal:ci
          for i in $(seq 30); do curl -fs http://127.0.0.1:8020/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8020/health
          test "$(curl -fsS -H 'Host: alinea.localhost' -o /dev/null -w '%{http_code}' http://127.0.0.1:8020/api/tenant)" = 200
          curl -fsS -H 'Host: alinea.localhost' http://127.0.0.1:8020/painel/ | grep -q '/painel/assets/'
          asset=$(curl -fsS -H 'Host: alinea.localhost' http://127.0.0.1:8020/painel/ | grep -o '/painel/assets/[^"]*\.js' | head -1)
          curl -fsS -o /dev/null "http://127.0.0.1:8020$asset"
          test "$(curl -sSI http://127.0.0.1:8020/painel/ -H 'Host: alinea.localhost' | grep -ci x-build-id:\ ci)" = 1
      - if: failure()
        run: docker logs app || true
