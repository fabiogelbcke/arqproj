# Checks on every pull request into `staging` (and on pushes to it). The branch
# accepts only pull requests whose checks pass. Same commands as locally: `make
# test`, `make lint`, `make e2e`, plus building the production image.
name: CI

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The superuser of the PostgreSQL started below (locally, it is you).
  PGUSER: postgres

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # On the runner's own network, so the server really is local: the tests'
      # guard refuses any database server that is not on this machine, and a
      # service container would sit behind Docker's network instead.
      - name: PostgreSQL 17
        run: |
          docker run -d --name postgres --network host -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for i in $(seq 60); do docker exec postgres pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - run: uv sync --frozen --no-group legacy
      - run: uv run python -m backend.commands.local_db setup
      - run: uv run pytest -q
      - run: uv run ruff check backend && uv run ruff format --check backend

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run api-types:check
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # On the runner's own network, so the server really is local: the tests'
      # guard refuses any database server that is not on this machine, and a
      # service container would sit behind Docker's network instead.
      - name: PostgreSQL 17
        run: |
          docker run -d --name postgres --network host -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17
          for i in $(seq 60); do docker exec postgres pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen --no-group legacy
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          build-args: BUILD_ID=ci
