# The portal-staging Cloud Run service. Applied by deploy/staging/cloudbuild.yaml
# with the image and build ID filled in; change settings here, in a PR.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: portal-staging
  annotations:
    # Public website: no Google sign-in needed to reach it.
    run.googleapis.com/invoker-iam-disabled: "true"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/startup-cpu-boost: "true"
        # The app starts only once the database proxy is ready.
        run.googleapis.com/container-dependencies: '{"app":["cloudsql"]}'
    spec:
      serviceAccountName: portal-staging@arq-proj.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
          env:
            - name: ENVIRONMENT
              value: staging
            - name: BUILD_ID
              value: BUILD_ID_PLACEHOLDER
            - name: GOOGLE_CLOUD_PROJECT
              value: arq-proj
            # The restricted login (tenant isolation applies), through the proxy
            # below; no password: the proxy logs in as this service's identity.
            - name: DATABASE_URL
              value: postgresql+psycopg://portal-staging%40arq-proj.iam@127.0.0.1:5432/arqproj_staging
            - name: DATABASE_RUNTIME_ROLE
              value: portal-staging@arq-proj.iam
            # Google Drive connection (docs/infrastructure.md, "Google Drive on staging").
            - name: GOOGLE_OAUTH_CLIENT_ID
              value: 496714293251-do3f1dtjsv5ae4l7559h3ghhg2ng34u5.apps.googleusercontent.com
            - name: GOOGLE_OAUTH_REDIRECT_URI
              value: https://portal-staging-496714293251.us-east1.run.app/api/drive/callback
            - name: DRIVE_READER_IDENTITY
              value: portal-staging@arq-proj.iam.gserviceaccount.com
            # Secrets, read from Secret Manager by name; values never in the repo.
            - name: GOOGLE_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: portal-staging-oauth-client-secret
                  key: latest
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: portal-staging-app-secret
                  key: latest
            # Client emails (A32): staging sends only to the office's staff accounts.
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: portal-staging-resend-api-key
                  key: latest
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
            periodSeconds: 2
            failureThreshold: 30
        - name: cloudsql
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.26.2
          args:
            - --auto-iam-authn
            - --port=5432
            - --health-check
            - --http-address=0.0.0.0
            - --http-port=9801
            - arq-proj:us-east1:arqproj-db
          resources:
            limits:
              cpu: "0.5"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /startup
              port: 9801
            periodSeconds: 1
            failureThreshold: 30
